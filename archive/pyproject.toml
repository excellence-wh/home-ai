[project]
name = "home-ai"
dynamic = ["version"]
description = "A Python API for Xiaomi Mijia (home-ai)"
authors = [{ name = "Excellence Technology", email = "excellence.wh@outlook.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=3.4.2",
    "pillow>=11.3.0",
    "pycryptodome>=3.23.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "tzlocal>=5.3.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
home-ai = "home_ai.__main__:cli"

[tool.setuptools.packages.find]
include = ["home_ai"]

[tool.setuptools.dynamic]
version = {attr = "home_ai.version.version"}

[project.urls]
Homepage = "https://github.com/excellence-wh/home-ai"
Repository = "https://github.com/excellence-wh/home-ai"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.6",
]

[[tool.uv.index]]
url = "https://mirror.nju.edu.cn/pypi/web/simple"
publish-url = "https://upload.pypi.org/legacy/"
default = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
